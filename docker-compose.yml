services:
  api:
    build: .
    environment:
      STORAGE_DIR: /app/storage
    volumes:
      - appdata:/app/storage
    expose:
      - "8000"
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
volumes:
  appdata:
